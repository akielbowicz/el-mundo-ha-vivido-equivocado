pre-commit:
  parallel: true
  commands:
    html-validate:
      glob: "*.html"
      run: npx html-validate --config .htmlvalidate.json {staged_files}
    reader-mode:
      glob: "*.html"
      run: node scripts/check-reader-mode.mjs {staged_files}
    shellcheck:
      # scripts bash en scripts/ (sin extensión). Filtramos acá y no con glob:
      # las negaciones de glob no excluyen bien los .mjs en lefthook.
      run: |
        for f in {staged_files}; do
          case "$f" in
            scripts/*)
              case "$f" in
                *.mjs|*.html|*.css|*.py|*.json|*.edn) ;;
                *) shellcheck -S warning "$f" ;;
              esac ;;
          esac
        done
    typos:
      # typo checker (diccionario inglés) — config en _typos.toml
      run: typos

pre-push:
  parallel: false
  commands:
    build:
      run: just build
    validate-built:
      run: npx html-validate --config .htmlvalidate.json dist/index.html
    a11y-audit:
      run: node scripts/a11y-audit.mjs