name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: "pages"
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install just
        uses: extractions/setup-just@v2
        with:
          just-version: 1.36.0

      - name: Install pandoc + weasyprint (for EPUB/PDF generation)
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc libpango-1.0-0 libpangocairo-1.0-0 libffi-dev shared-mime-info python3-pip
          python3 -m pip install --user weasyprint
          echo "$(python3 -m site --user-base)/bin" >> $GITHUB_PATH

      - name: Build site
        run: just build

      - name: Unit tests (build pipeline)
        run: just check-tests

      - name: Validate HTML
        run: just check-html

      - name: Validate reader mode
        run: |
          node scripts/check-reader-mode.mjs dist/index.html
          node scripts/check-reader-mode.mjs dist/episodios/index.html
          node scripts/check-reader-mode.mjs dist/textos/index.html

      - name: Verify artifacts
        run: |
          test -f dist/search-index.json || { echo "Missing search-index.json"; exit 1; }
          test -f dist/core.js || { echo "Missing core.js"; exit 1; }
          test -f dist/search.mjs || { echo "Missing search.mjs"; exit 1; }
          test -f dist/404.html || { echo "Missing 404.html"; exit 1; }
          test -d dist/episodios || { echo "Missing episodios/"; exit 1; }
          test -d dist/textos || { echo "Missing textos/"; exit 1; }

      - name: Validate EPUB files
        run: just check-epub

      - name: A11y audit
        run: just check-a11y

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: JS smoke test
        run: just check-js

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4