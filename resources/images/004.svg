<?xml version="1.0" encoding="UTF-8"?>
<!--
  Portada 004.svg — El mundo ha vivido equivocado
  Episodio: Episodio 04

  Estructura (capas Inkscape, de abajo hacia arriba):
    fondo       → gradiente base, reemplazable por cualquier treatment
    marco       → borde interior fino
    decoracion  → ZONA LIBRE: ilustración de la tapa (reemplazar los
                  placeholders por la composición del episodio)
    titulo      → título + autor (no mover de y=150/180 sin ajustar decoracion)
    badge       → número de episodio

  Paleta usada: cobalto
    fondo  #0e2229 → #163540
    acento #88ccd4 → #a8e0e6
  Contraste texto/fondo: 11.3:1 (WCAG AA ≥ 4.5:1)
  Otras: oro-clasico, verde-yerba, noche-azul, vino-tinto, violeta, cobalto, ambar, rosa-bajo, salvia, terracota
  Forzar una: pasale "palette=<nombre>" al script new-cover.mjs
  Mantener contraste ≥ 4.5:1 (WCAG AA) si se ajustan colores a mano.
-->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" viewBox="0 0 400 400" width="400" height="400">
  <title>Episodio 04</title>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0e2229"/>
      <stop offset="100%" style="stop-color:#163540"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#88ccd4"/>
      <stop offset="100%" style="stop-color:#a8e0e6"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0%" style="stop-color:#a8e0e6;stop-opacity:0.22"/>
      <stop offset="100%" style="stop-color:#a8e0e6;stop-opacity:0"/>
    </radialGradient>
  </defs>

  <g inkscape:groupmode="layer" id="fondo" inkscape:label="fondo">
    <rect width="400" height="400" rx="8" fill="url(#bg)"/>
  </g>

  <g inkscape:groupmode="layer" id="marco" inkscape:label="marco">
    <rect x="20" y="20" width="360" height="360" rx="6" fill="none" stroke="url(#accent)" stroke-width="1.5" opacity="0.4"/>
    <rect x="60" y="100" width="280" height="2" fill="url(#accent)" opacity="0.6"/>
    <rect x="60" y="298" width="280" height="2" fill="url(#accent)" opacity="0.6"/>
  </g>

  <!-- ZONA LIBRE para ilustración: este grupo es el que un LLM (o vos en
       Inkscape) reemplaza por la composición del episodio. -->
  <!-- Candelabro de plata (Castillo) + cuadrado de 40 cm² (Schweblin) -->
  <g inkscape:groupmode="layer" id="decoracion" inkscape:label="decoracion">
    <!-- resplandor de las llamas -->
    <circle cx="88" cy="207" r="20" fill="url(#glow)"/>
    <circle cx="118" cy="199" r="24" fill="url(#glow)"/>
    <circle cx="148" cy="207" r="20" fill="url(#glow)"/>

    <!-- llamas -->
    <path d="M 88 200 C 91 204 92 207 88 211 C 84 207 85 204 88 200 Z" fill="#a8e0e6" opacity="0.95"/>
    <path d="M 118 192 C 122 196 123 200 118 205 C 113 200 114 196 118 192 Z" fill="#a8e0e6"/>
    <path d="M 148 200 C 151 204 152 207 148 211 C 144 207 145 204 148 200 Z" fill="#a8e0e6" opacity="0.95"/>

    <!-- velas -->
    <rect x="95.5" y="212" width="5" height="19" rx="1.5" fill="#a8e0e6" opacity="0.55"/>
    <rect x="115.5" y="206" width="5" height="25" rx="1.5" fill="#a8e0e6" opacity="0.7"/>
    <rect x="135.5" y="212" width="5" height="19" rx="1.5" fill="#a8e0e6" opacity="0.55"/>

    <!-- platos de las velas -->
    <path d="M 88 232 h 20 l -3.5 5 h -13 Z" fill="url(#accent)"/>
    <path d="M 108 232 h 20 l -3.5 5 h -13 Z" fill="url(#accent)"/>
    <path d="M 128 232 h 20 l -3.5 5 h -13 Z" fill="url(#accent)"/>

    <!-- brazos curvos -->
    <path d="M 118 254 C 100 254 88 248 88 237" fill="none" stroke="url(#accent)" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 118 254 C 136 254 148 248 148 237" fill="none" stroke="url(#accent)" stroke-width="2.5" stroke-linecap="round"/>

    <!-- astil y base -->
    <rect x="115.5" y="237" width="5" height="40" rx="2" fill="url(#accent)"/>
    <ellipse cx="118" cy="279" rx="20" ry="4" fill="url(#accent)"/>
    <ellipse cx="118" cy="276" rx="10" ry="2.5" fill="url(#accent)" opacity="0.7"/>

    <!-- cuarenta centímetros cuadrados -->
    <rect x="296" y="114" width="40" height="40" fill="none" stroke="#a8e0e6" stroke-width="1.2" stroke-dasharray="4 3" opacity="0.6"/>
    <rect x="304" y="122" width="24" height="24" fill="none" stroke="#a8e0e6" stroke-width="0.8" opacity="0.35"/>
    <text x="316" y="170" text-anchor="middle" fill="#a8e0e6" font-family="sans-serif" font-size="9" opacity="0.6">40 cm²</text>

    <!-- brillos laterales -->
    <text x="66" y="150" text-anchor="middle" fill="#a8e0e6" font-family="sans-serif" font-size="12" opacity="0.3">✦</text>
    <text x="78" y="290" text-anchor="middle" fill="#a8e0e6" font-family="sans-serif" font-size="8" opacity="0.25">✦</text>
  </g>

  <g inkscape:groupmode="layer" id="titulo" inkscape:label="titulo">
    <text x="200" y="150" text-anchor="middle" fill="url(#accent)" font-family="Georgia, serif" font-size="22" font-weight="bold">Episodio 04</text>
    <text x="200" y="180" text-anchor="middle" fill="#a8e0e6" font-family="Georgia, serif" font-size="11" opacity="0.7">Abelardo Castillo · Samanta Schweblin</text>
    <!--
      Si el título es largo, bajar font-size o partir en dos <text> (y=135 y y=160).
      El <title> del episodio tiene regla a11y: mantener textos legibles.
    -->
  </g>

  <g inkscape:groupmode="layer" id="badge" inkscape:label="badge">
    <rect x="140" y="260" width="120" height="24" rx="12" fill="url(#accent)" opacity="0.2"/>
    <text x="200" y="277" text-anchor="middle" fill="url(#accent)" font-family="sans-serif" font-size="11" font-weight="600">EPISODIO 4</text>
  </g>
</svg>
