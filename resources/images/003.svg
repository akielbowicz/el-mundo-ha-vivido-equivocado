<?xml version="1.0" encoding="UTF-8"?>
<!--
  Portada 003.svg — El mundo ha vivido equivocado
  Episodio: Episodio 03

  Estructura (capas Inkscape, de abajo hacia arriba):
    fondo       → gradiente base, reemplazable por cualquier treatment
    marco       → borde interior fino
    decoracion  → ZONA LIBRE: ilustración de la tapa (reemplazar los
                  placeholders por la composición del episodio)
    titulo      → título + autor (no mover de y=150/180 sin ajustar decoracion)
    badge       → número de episodio

  Paleta usada: noche-azul
    fondo  #101c2e → #1a2c47
    acento #8ab4d8 → #a8cce8
  Contraste texto/fondo: 10.2:1 (WCAG AA ≥ 4.5:1)
  Otras: oro-clasico, verde-yerba, noche-azul, vino-tinto, violeta, cobalto, ambar, rosa-bajo, salvia, terracota
  Forzar una: pasale "palette=<nombre>" al script new-cover.mjs
  Mantener contraste ≥ 4.5:1 (WCAG AA) si se ajustan colores a mano.
-->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" viewBox="0 0 400 400" width="400" height="400">
  <title>Episodio 03</title>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#101c2e"/>
      <stop offset="100%" style="stop-color:#1a2c47"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8ab4d8"/>
      <stop offset="100%" style="stop-color:#a8cce8"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0%" style="stop-color:#a8cce8;stop-opacity:0.22"/>
      <stop offset="100%" style="stop-color:#a8cce8;stop-opacity:0"/>
    </radialGradient>
  </defs>

  <g inkscape:groupmode="layer" id="fondo" inkscape:label="fondo">
    <rect width="400" height="400" rx="8" fill="url(#bg)"/>
  </g>

  <g inkscape:groupmode="layer" id="marco" inkscape:label="marco">
    <rect x="20" y="20" width="360" height="360" rx="6" fill="none" stroke="url(#accent)" stroke-width="1.5" opacity="0.4"/>
    <rect x="60" y="100" width="280" height="2" fill="url(#accent)" opacity="0.6"/>
    <rect x="60" y="298" width="280" height="2" fill="url(#accent)" opacity="0.6"/>
  </g>

  <!-- Guantes de boxeo (Oyola) + pelota (Almada) -->
  <g inkscape:groupmode="layer" id="decoracion" inkscape:label="decoracion">
    <!-- soga -->
    <line x1="146" y1="190" x2="254" y2="190" stroke="url(#accent)" stroke-width="1.5" opacity="0.5"/>

    <!-- guante izquierdo -->
    <line x1="168" y1="190" x2="168" y2="200" stroke="url(#accent)" stroke-width="1.2" opacity="0.7"/>
    <circle cx="168" cy="220" r="24" fill="url(#glow)"/>
    <circle cx="168" cy="218" r="22" fill="url(#accent)" opacity="0.85"/>
    <circle cx="184" cy="229" r="8" fill="url(#accent)" opacity="0.85"/>
    <rect x="155" y="237" width="26" height="12" rx="3" fill="url(#accent)" opacity="0.55"/>
    <path d="M 161 202 q -3 15 0 29" fill="none" stroke="#101c2e" stroke-width="1" opacity="0.35"/>

    <!-- guante derecho (espejado) -->
    <line x1="232" y1="190" x2="232" y2="200" stroke="url(#accent)" stroke-width="1.2" opacity="0.7"/>
    <circle cx="232" cy="220" r="24" fill="url(#glow)"/>
    <circle cx="232" cy="218" r="22" fill="url(#accent)" opacity="0.85"/>
    <circle cx="216" cy="229" r="8" fill="url(#accent)" opacity="0.85"/>
    <rect x="219" y="237" width="26" height="12" rx="3" fill="url(#accent)" opacity="0.55"/>
    <path d="M 239 202 q 3 15 0 29" fill="none" stroke="#101c2e" stroke-width="1" opacity="0.35"/>

    <!-- pelota -->
    <circle cx="305" cy="240" r="19" fill="url(#accent)" opacity="0.85"/>
    <path d="M 305 230 L 310.7 234.1 L 308.5 240.9 L 301.5 240.9 L 299.3 234.1 Z" fill="#101c2e" opacity="0.75"/>
    <line x1="310.7" y1="234.1" x2="317" y2="231" stroke="#101c2e" stroke-width="1" opacity="0.5"/>
    <line x1="308.5" y1="240.9" x2="314" y2="246" stroke="#101c2e" stroke-width="1" opacity="0.5"/>
    <line x1="301.5" y1="240.9" x2="296" y2="246" stroke="#101c2e" stroke-width="1" opacity="0.5"/>
    <!-- trayectoria -->
    <path d="M 274 226 q -8 14 0 28" fill="none" stroke="url(#accent)" stroke-width="1.2" opacity="0.4"/>
    <path d="M 283 232 q -5 8 0 16" fill="none" stroke="url(#accent)" stroke-width="1" opacity="0.3"/>

    <!-- brillos -->
    <text x="88" y="158" text-anchor="middle" fill="#a8cce8" font-family="sans-serif" font-size="11" opacity="0.35">✦</text>
    <text x="318" y="192" text-anchor="middle" fill="#a8cce8" font-family="sans-serif" font-size="8" opacity="0.3">✦</text>
  </g>

  <g inkscape:groupmode="layer" id="titulo" inkscape:label="titulo">
    <text x="200" y="150" text-anchor="middle" fill="url(#accent)" font-family="Georgia, serif" font-size="22" font-weight="bold">Episodio 03</text>
    <text x="200" y="180" text-anchor="middle" fill="#a8cce8" font-family="Georgia, serif" font-size="11" opacity="0.7">Leonardo Oyola · Selva Almada</text>
    <!--
      Si el título es largo, bajar font-size o partir en dos <text> (y=135 y y=160).
      El <title> del episodio tiene regla a11y: mantener textos legibles.
    -->
  </g>

  <g inkscape:groupmode="layer" id="badge" inkscape:label="badge">
    <rect x="140" y="260" width="120" height="24" rx="12" fill="url(#accent)" opacity="0.2"/>
    <text x="200" y="277" text-anchor="middle" fill="url(#accent)" font-family="sans-serif" font-size="11" font-weight="600">EPISODIO 3</text>
  </g>
</svg>
