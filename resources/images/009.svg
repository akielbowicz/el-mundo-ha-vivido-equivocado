<?xml version="1.0" encoding="UTF-8"?>
<!--
  Portada 009.svg — El mundo ha vivido equivocado
  Episodio: Episodio 09

  Estructura (capas Inkscape, de abajo hacia arriba):
    fondo       → gradiente base, reemplazable por cualquier treatment
    marco       → borde interior fino
    decoracion  → ZONA LIBRE: ilustración de la tapa (reemplazar los
                  placeholders por la composición del episodio)
    titulo      → título + autor (no mover de y=150/180 sin ajustar decoracion)
    badge       → número de episodio

  Paleta usada: violeta
    fondo  #221830 → #342447
    acento #c0a8e0 → #d4c2ec
  Contraste texto/fondo: 10.3:1 (WCAG AA ≥ 4.5:1)
  Otras: oro-clasico, verde-yerba, noche-azul, vino-tinto, violeta, cobalto, ambar, rosa-bajo, salvia, terracota
  Forzar una: pasale "palette=<nombre>" al script new-cover.mjs
  Mantener contraste ≥ 4.5:1 (WCAG AA) si se ajustan colores a mano.
-->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" viewBox="0 0 400 400" width="400" height="400">
  <title>Episodio 09</title>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#221830"/>
      <stop offset="100%" style="stop-color:#342447"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#c0a8e0"/>
      <stop offset="100%" style="stop-color:#d4c2ec"/>
    </linearGradient>
  </defs>

  <g inkscape:groupmode="layer" id="fondo" inkscape:label="fondo">
    <rect width="400" height="400" rx="8" fill="url(#bg)"/>
  </g>

  <g inkscape:groupmode="layer" id="marco" inkscape:label="marco">
    <rect x="20" y="20" width="360" height="360" rx="6" fill="none" stroke="url(#accent)" stroke-width="1.5" opacity="0.4"/>
    <rect x="60" y="100" width="280" height="2" fill="url(#accent)" opacity="0.6"/>
    <rect x="60" y="298" width="280" height="2" fill="url(#accent)" opacity="0.6"/>
  </g>

  <!-- ZONA LIBRE para ilustración: narración oral — la boca que cuenta,
       ondas de voz que viajan y llegan como destello al que escucha. -->
  <g inkscape:groupmode="layer" id="decoracion" inkscape:label="decoracion">
    <!-- boca: cavidad + labios separados + lengua -->
    <path d="M 98 196 Q 150 178 202 196 L 202 212 Q 150 270 98 212 Z" fill="#160d20" opacity="0.9"/>
    <path d="M 98 196 Q 150 178 202 196" fill="none" stroke="url(#accent)" stroke-width="7" stroke-linecap="round"/>
    <path d="M 98 212 Q 150 270 202 212" fill="none" stroke="url(#accent)" stroke-width="7" stroke-linecap="round"/>
    <path d="M 128 220 Q 150 230 172 220" fill="none" stroke="#d4c2ec" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
    <!-- dientes -->
    <rect x="120" y="200" width="60" height="9" rx="4.5" fill="#d4c2ec" opacity="0.45"/>
    <!-- ondas de voz -->
    <path d="M 218 192 Q 240 212 218 232" fill="none" stroke="#d4c2ec" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
    <path d="M 240 178 Q 272 212 240 246" fill="none" stroke="#d4c2ec" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <path d="M 262 164 Q 304 212 262 260" fill="none" stroke="#d4c2ec" stroke-width="1.5" stroke-linecap="round" opacity="0.35"/>
    <!-- palabras que llegan + destello -->
    <circle cx="298" cy="204" r="3" fill="#d4c2ec" opacity="0.5"/>
    <circle cx="310" cy="220" r="2" fill="#d4c2ec" opacity="0.35"/>
    <g stroke="#d4c2ec" stroke-width="1.5" stroke-linecap="round" opacity="0.55">
      <path d="M 316 170 L 316 186"/>
      <path d="M 308 178 L 324 178"/>
    </g>
  </g>

  <g inkscape:groupmode="layer" id="titulo" inkscape:label="titulo">
    <text x="200" y="150" text-anchor="middle" fill="url(#accent)" font-family="Georgia, serif" font-size="22" font-weight="bold">Episodio 09</text>
    <text x="200" y="180" text-anchor="middle" fill="#d4c2ec" font-family="Georgia, serif" font-size="11" opacity="0.7">Sasha · con Susi Calderón</text>
    <!--
      Si el título es largo, bajar font-size o partir en dos <text> (y=135 y y=160).
      El <title> del episodio tiene regla a11y: mantener textos legibles.
    -->
  </g>

  <g inkscape:groupmode="layer" id="badge" inkscape:label="badge">
    <rect x="140" y="260" width="120" height="24" rx="12" fill="url(#accent)" opacity="0.2"/>
    <text x="200" y="277" text-anchor="middle" fill="url(#accent)" font-family="sans-serif" font-size="11" font-weight="600">EPISODIO 9</text>
  </g>
</svg>
