<?xml version="1.0" encoding="UTF-8"?>
<!--
  Portada 006.svg — El mundo ha vivido equivocado
  Episodio: Episodio 06

  Estructura (capas Inkscape, de abajo hacia arriba):
    fondo       → gradiente base, reemplazable por cualquier treatment
    marco       → borde interior fino
    decoracion  → ZONA LIBRE: ilustración de la tapa (reemplazar los
                  placeholders por la composición del episodio)
    titulo      → título + autor (no mover de y=150/180 sin ajustar decoracion)
    badge       → número de episodio

  Paleta usada: ambar
    fondo  #2b2005 → #44330a
    acento #e0c070 → #f0d48c
  Contraste texto/fondo: 11.1:1 (WCAG AA ≥ 4.5:1)
  Otras: oro-clasico, verde-yerba, noche-azul, vino-tinto, violeta, cobalto, ambar, rosa-bajo, salvia, terracota
  Forzar una: pasale "palette=<nombre>" al script new-cover.mjs
  Mantener contraste ≥ 4.5:1 (WCAG AA) si se ajustan colores a mano.
-->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" viewBox="0 0 400 400" width="400" height="400">
  <title>Episodio 06</title>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2b2005"/>
      <stop offset="100%" style="stop-color:#44330a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e0c070"/>
      <stop offset="100%" style="stop-color:#f0d48c"/>
    </linearGradient>
  </defs>

  <g inkscape:groupmode="layer" id="fondo" inkscape:label="fondo">
    <rect width="400" height="400" rx="8" fill="url(#bg)"/>
  </g>

  <g inkscape:groupmode="layer" id="marco" inkscape:label="marco">
    <rect x="20" y="20" width="360" height="360" rx="6" fill="none" stroke="url(#accent)" stroke-width="1.5" opacity="0.4"/>
    <rect x="60" y="100" width="280" height="2" fill="url(#accent)" opacity="0.6"/>
    <rect x="60" y="298" width="280" height="2" fill="url(#accent)" opacity="0.6"/>
  </g>

  <!-- Ilustración: ola (tsunami) arriba, estufa encendida al centro,
       médanos abajo. Línea fina en color acento sobre fondo cálido. -->
  <g inkscape:groupmode="layer" id="decoracion" inkscape:label="decoracion">
    <!-- ola con crestas + gotas -->
    <path d="M 78 236 Q 104 204 132 228 Q 152 244 178 226" fill="none" stroke="url(#accent)" stroke-width="2.2" opacity="0.55" stroke-linecap="round"/>
    <path d="M 84 250 Q 116 226 148 244 Q 172 256 196 242" fill="none" stroke="url(#accent)" stroke-width="1.2" opacity="0.3" stroke-linecap="round"/>
    <circle cx="206" cy="212" r="2" fill="#f0d48c" opacity="0.45"/>
    <circle cx="222" cy="222" r="1.5" fill="#f0d48c" opacity="0.35"/>
    <circle cx="188" cy="204" r="1.5" fill="#f0d48c" opacity="0.3"/>
    <!-- resplandor de la estufa -->
    <circle cx="200" cy="266" r="30" fill="#f0d48c" opacity="0.08"/>
    <circle cx="200" cy="266" r="19" fill="#f0d48c" opacity="0.12"/>
    <!-- caño de la estufa + humo -->
    <rect x="196" y="214" width="8" height="36" fill="url(#accent)" opacity="0.5"/>
    <path d="M 204 208 Q 212 200 206 192 Q 200 185 208 178" fill="none" stroke="url(#accent)" stroke-width="1.2" opacity="0.3" stroke-linecap="round"/>
    <path d="M 198 206 Q 190 197 197 189" fill="none" stroke="url(#accent)" stroke-width="1" opacity="0.2" stroke-linecap="round"/>
    <!-- cuerpo de la estufa -->
    <rect x="180" y="250" width="40" height="36" rx="3" fill="none" stroke="url(#accent)" stroke-width="2" opacity="0.85"/>
    <rect x="190" y="261" width="20" height="15" rx="2" fill="none" stroke="#f0d48c" stroke-width="1.2" opacity="0.7"/>
    <!-- fuego en la puerta -->
    <path d="M 200 274 Q 196 269 200 264 Q 204 269 200 274 Z" fill="#f0d48c" opacity="0.8"/>
    <path d="M 193 274 Q 191 271 193 268 Q 194 272 193 274 Z" fill="#f0d48c" opacity="0.5"/>
    <path d="M 207 274 Q 209 271 207 268 Q 206 272 207 274 Z" fill="#f0d48c" opacity="0.5"/>
    <!-- patas -->
    <line x1="184" y1="286" x2="184" y2="292" stroke="url(#accent)" stroke-width="2" opacity="0.7"/>
    <line x1="216" y1="286" x2="216" y2="292" stroke="url(#accent)" stroke-width="2" opacity="0.7"/>
    <!-- médanos -->
    <path d="M 60 296 Q 132 262 208 290 Q 280 314 340 296 L 340 300 L 60 300 Z" fill="#f0d48c" opacity="0.10"/>
    <path d="M 60 300 Q 170 274 340 300 Z" fill="#f0d48c" opacity="0.16"/>
  </g>

  <g inkscape:groupmode="layer" id="titulo" inkscape:label="titulo">
    <text x="200" y="150" text-anchor="middle" fill="url(#accent)" font-family="Georgia, serif" font-size="22" font-weight="bold">Episodio 06</text>
    <text x="200" y="180" text-anchor="middle" fill="#f0d48c" font-family="Georgia, serif" font-size="11" opacity="0.7">Sylvia Iparraguirre · Magalí Etchebarne</text>
    <!--
      Si el título es largo, bajar font-size o partir en dos <text> (y=135 y y=160).
      El <title> del episodio tiene regla a11y: mantener textos legibles.
    -->
  </g>

  <g inkscape:groupmode="layer" id="badge" inkscape:label="badge">
    <rect x="140" y="260" width="120" height="24" rx="12" fill="url(#accent)" opacity="0.2"/>
    <text x="200" y="277" text-anchor="middle" fill="url(#accent)" font-family="sans-serif" font-size="11" font-weight="600">EPISODIO 6</text>
  </g>
</svg>
