<?xml version="1.0" encoding="UTF-8"?>
<!--
  Portada 013.svg — El mundo ha vivido equivocado
  Episodio: Episodio 13 (Miguel Briante · Ricardo Piglia · Héctor Viel Temperley)

  Composición: dos nadadores cruzando el agua hacia un pueblo pequeño en la
  orilla. Los dos nadadores son los dos "El nadador" del programa — el cuento
  de Piglia y el poema de Viel Temperley —; el pueblo con su luz encendida
  es Kincón, el pueblo de Briante. Nadie nada solo: el agua une los tres.

  Estructura (capas Inkscape, de abajo hacia arriba):
    fondo       → gradiente base
    marco       → borde interior fino
    decoracion  → ZONA LIBRE: ilustración de la tapa
    titulo      → título + autor (no mover de y=150/180 sin ajustar decoracion)
    badge       → número de episodio

  Paleta usada: cobalto
    fondo  #0e2229 → #163540
    acento #88ccd4 → #a8e0e6
  Contraste texto/fondo: >8:1 (WCAG AA ≥ 4.5:1)
-->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" viewBox="0 0 400 400" width="400" height="400">
  <title>Episodio 13</title>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0e2229"/>
      <stop offset="100%" style="stop-color:#163540"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#88ccd4"/>
      <stop offset="100%" style="stop-color:#a8e0e6"/>
    </linearGradient>
  </defs>

  <g inkscape:groupmode="layer" id="fondo" inkscape:label="fondo">
    <rect width="400" height="400" rx="8" fill="url(#bg)"/>
  </g>

  <g inkscape:groupmode="layer" id="marco" inkscape:label="marco">
    <rect x="20" y="20" width="360" height="360" rx="6" fill="none" stroke="url(#accent)" stroke-width="1.5" opacity="0.4"/>
    <rect x="60" y="100" width="280" height="2" fill="url(#accent)" opacity="0.6"/>
    <rect x="60" y="298" width="280" height="2" fill="url(#accent)" opacity="0.6"/>
  </g>

  <!-- ZONA LIBRE para ilustración: dos nadadores cruzando hacia un pueblo en la orilla -->
  <g inkscape:groupmode="layer" id="decoracion" inkscape:label="decoracion">
    <!-- estrellas -->
    <g fill="#a8e0e6">
      <circle cx="92" cy="212" r="1.4" opacity="0.5"/>
      <circle cx="148" cy="204" r="1" opacity="0.35"/>
      <circle cx="330" cy="210" r="1.2" opacity="0.45"/>
      <circle cx="300" cy="200" r="0.9" opacity="0.3"/>
    </g>

    <!-- orilla / pueblo (Kincón) sobre el horizonte del agua -->
    <g>
      <!-- línea de la costa -->
      <path d="M 60 238 L 340 238" stroke="url(#accent)" stroke-width="1.5" opacity="0.55"/>
      <!-- siluetas del pueblo -->
      <path d="M 240 238 L 240 222 L 252 214 L 264 222 L 264 238 Z" fill="url(#accent)" opacity="0.85"/>
      <path d="M 268 238 L 268 226 L 282 218 L 296 226 L 296 238 Z" fill="url(#accent)" opacity="0.6"/>
      <rect x="300" y="228" width="16" height="10" fill="url(#accent)" opacity="0.45"/>
      <path d="M 316 238 L 316 224 L 324 224 L 324 238 Z" fill="url(#accent)" opacity="0.7"/>
      <!-- ventana encendida -->
      <rect x="250" y="224" width="5" height="6" rx="1" fill="#f0dc9a" opacity="0.95"/>
      <!-- reflejo de la ventana en el agua -->
      <path d="M 247 246 h 11 M 249 252 h 7 M 250 258 h 5" stroke="#f0dc9a" stroke-width="1.2" stroke-linecap="round" opacity="0.35"/>
    </g>

    <!-- agua: ondas -->
    <g fill="none" stroke="url(#accent)" stroke-width="1.2" stroke-linecap="round" opacity="0.35">
      <path d="M 72 252 q 12 -5 24 0 t 24 0"/>
      <path d="M 160 262 q 12 -5 24 0 t 24 0"/>
      <path d="M 262 270 q 12 -5 24 0 t 24 0"/>
      <path d="M 92 282 q 12 -5 24 0 t 24 0"/>
      <path d="M 292 290 q 10 -4 20 0"/>
      <path d="M 200 292 q 12 -5 24 0"/>
    </g>

    <!-- nadador 1 (arriba, rumbo al pueblo) -->
    <g>
      <circle cx="128" cy="252" r="5.5" fill="url(#accent)" opacity="0.9"/>
      <path d="M 120 258 q 8 -8 18 -1" fill="none" stroke="url(#accent)" stroke-width="2.2" stroke-linecap="round" opacity="0.9"/>
      <path d="M 98 262 q 10 -4 20 -1 M 88 266 q 10 -3 18 0" fill="none" stroke="url(#accent)" stroke-width="1.4" stroke-linecap="round" opacity="0.5"/>
    </g>

    <!-- nadador 2 (abajo, más atrás) -->
    <g>
      <circle cx="228" cy="286" r="4.5" fill="url(#accent)" opacity="0.65"/>
      <path d="M 221 291 q 7 -6 14 -1" fill="none" stroke="url(#accent)" stroke-width="1.8" stroke-linecap="round" opacity="0.65"/>
      <path d="M 204 294 q 8 -3 16 -1" fill="none" stroke="url(#accent)" stroke-width="1.2" stroke-linecap="round" opacity="0.4"/>
    </g>
  </g>

  <g inkscape:groupmode="layer" id="titulo" inkscape:label="titulo">
    <text x="200" y="150" text-anchor="middle" fill="url(#accent)" font-family="Georgia, serif" font-size="22" font-weight="bold">Episodio 13</text>
    <text x="200" y="180" text-anchor="middle" fill="#a8e0e6" font-family="Georgia, serif" font-size="10" opacity="0.7">Miguel Briante · Ricardo Piglia · Héctor Viel Temperley</text>
  </g>

  <g inkscape:groupmode="layer" id="badge" inkscape:label="badge">
    <rect x="140" y="260" width="120" height="24" rx="12" fill="url(#accent)" opacity="0.2"/>
    <text x="200" y="277" text-anchor="middle" fill="url(#accent)" font-family="sans-serif" font-size="11" font-weight="600">EPISODIO 13</text>
  </g>
</svg>
