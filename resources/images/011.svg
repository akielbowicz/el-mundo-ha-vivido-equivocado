<?xml version="1.0" encoding="UTF-8"?>
<!--
  Portada 011.svg — El mundo ha vivido equivocado
  Episodio: Episodio 11 (El puma blanco pt. 1 · poema de Juan L. Ortiz · relato de Saer)

  Composición: puma blanco silueta bajo la luna, con el río abajo —
  el río une las tres piezas del episodio (el poema de Ortiz, la
  costanera de Saer, el monte del puma).

  Estructura (capas Inkscape, de abajo hacia arriba):
    fondo       → gradiente base, reemplazable por cualquier treatment
    marco       → borde interior fino
    decoracion  → ZONA LIBRE: ilustración de la tapa (reemplazar los
                  placeholders por la composición del episodio)
    titulo      → título + autor (no mover de y=150/180 sin ajustar decoracion)
    badge       → número de episodio

  Paleta usada: noche-azul
    fondo  #101c2e → #1a2c47
    acento #8ab4d8 → #a8cce8
  Contraste texto/fondo: 10.2:1 (WCAG AA ≥ 4.5:1)
  Otras: oro-clasico, verde-yerba, noche-azul, vino-tinto, violeta, cobalto, ambar, rosa-bajo, salvia, terracota
  Forzar una: pasale "palette=<nombre>" al script new-cover.mjs
  Mantener contraste ≥ 4.5:1 (WCAG AA) si se ajustas colores a mano.
-->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" viewBox="0 0 400 400" width="400" height="400">
  <title>Episodio 11</title>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#101c2e"/>
      <stop offset="100%" style="stop-color:#1a2c47"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8ab4d8"/>
      <stop offset="100%" style="stop-color:#a8cce8"/>
    </linearGradient>
  </defs>

  <g inkscape:groupmode="layer" id="fondo" inkscape:label="fondo">
    <rect width="400" height="400" rx="8" fill="url(#bg)"/>
  </g>

  <g inkscape:groupmode="layer" id="marco" inkscape:label="marco">
    <rect x="20" y="20" width="360" height="360" rx="6" fill="none" stroke="url(#accent)" stroke-width="1.5" opacity="0.4"/>
    <rect x="60" y="100" width="280" height="2" fill="url(#accent)" opacity="0.6"/>
    <rect x="60" y="298" width="280" height="2" fill="url(#accent)" opacity="0.6"/>
  </g>

  <!-- ZONA LIBRE para ilustración: este grupo es el que un LLM (o vos en
       Inkscape) reemplaza por la composición del episodio. -->
  <g inkscape:groupmode="layer" id="decoracion" inkscape:label="decoracion">
    <!-- luna -->
    <circle cx="305" cy="142" r="17" fill="#dce8f2" opacity="0.9"/>
    <circle cx="298" cy="138" r="15" fill="#101c2e" opacity="0.85"/>
    <!-- estrellas -->
    <circle cx="96" cy="150" r="1.6" fill="#dce8f2" opacity="0.5"/>
    <circle cx="132" cy="128" r="1.2" fill="#dce8f2" opacity="0.4"/>
    <circle cx="210" cy="140" r="1.6" fill="#dce8f2" opacity="0.5"/>
    <circle cx="330" cy="210" r="1.4" fill="#dce8f2" opacity="0.45"/>
    <circle cx="82" cy="204" r="1.4" fill="#dce8f2" opacity="0.45"/>
    <circle cx="248" cy="126" r="1" fill="#dce8f2" opacity="0.35"/>
    <!-- puma blanco: cuerpo + cabeza + orejas + patas -->
    <g fill="#e8f0f6">
      <ellipse cx="200" cy="222" rx="44" ry="19"/>
      <circle cx="163" cy="206" r="13"/>
      <path d="M 152 197 l 4 -10 l 6 7 z"/>
      <path d="M 165 194 l 6 -9 l 4 8 z"/>
      <rect x="168" y="236" width="6.5" height="22" rx="2.5"/>
      <rect x="182" y="238" width="6.5" height="20" rx="2.5"/>
      <rect x="216" y="238" width="6.5" height="20" rx="2.5"/>
      <rect x="230" y="236" width="6.5" height="22" rx="2.5"/>
    </g>
    <!-- puma blanco: cola -->
    <path d="M 240 226 C 258 228 266 238 261 250 C 258 257 249 258 245 252" fill="none" stroke="#e8f0f6" stroke-width="8" stroke-linecap="round"/>
    <!-- río -->
    <path d="M 76 288 q 15 -7 30 0 t 30 0 t 30 0 t 30 0 t 30 0 t 30 0 t 30 0 t 30 0" fill="none" stroke="url(#accent)" stroke-width="2" opacity="0.45"/>
    <path d="M 90 296 q 15 -6 30 0 t 30 0 t 30 0 t 30 0 t 30 0 t 30 0 t 30 0 t 30 0" fill="none" stroke="url(#accent)" stroke-width="1.5" opacity="0.25"/>
  </g>

  <g inkscape:groupmode="layer" id="titulo" inkscape:label="titulo">
    <text x="200" y="150" text-anchor="middle" fill="url(#accent)" font-family="Georgia, serif" font-size="22" font-weight="bold">Episodio 11</text>
    <text x="200" y="180" text-anchor="middle" fill="#a8cce8" font-family="Georgia, serif" font-size="11" opacity="0.7">Antonio Di Benedetto · Juan José Saer · Juan L. Ortiz</text>
    <!--
      Si el título es largo, bajar font-size o partir en dos <text> (y=135 y y=160).
      El <title> del episodio tiene regla a11y: mantener textos legibles.
    -->
  </g>

  <g inkscape:groupmode="layer" id="badge" inkscape:label="badge">
    <rect x="140" y="260" width="120" height="24" rx="12" fill="url(#accent)" opacity="0.2"/>
    <text x="200" y="277" text-anchor="middle" fill="url(#accent)" font-family="sans-serif" font-size="11" font-weight="600">EPISODIO 11</text>
  </g>
</svg>
