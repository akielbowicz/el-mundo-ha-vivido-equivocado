<?xml version="1.0" encoding="UTF-8"?>
<!--
  Portada 002.svg — El mundo ha vivido equivocado
  Episodio: Episodio 02

  Estructura (capas Inkscape, de abajo hacia arriba):
    fondo       → gradiente base, reemplazable por cualquier treatment
    marco       → borde interior fino
    decoracion  → ZONA LIBRE: ilustración de la tapa (reemplazar los
                  placeholders por la composición del episodio)
    titulo      → título + autor (no mover de y=150/180 sin ajustar decoracion)
    badge       → número de episodio

  Paleta usada: terracota
    fondo  #301b12 → #4a2a1c
    acento #e0a888 → #eec0a4
  Contraste texto/fondo: 9.8:1 (WCAG AA ≥ 4.5:1)
  Otras: oro-clasico, verde-yerba, noche-azul, vino-tinto, violeta, cobalto, ambar, rosa-bajo, salvia, terracota
  Forzar una: pasale "palette=<nombre>" al script new-cover.mjs
  Mantener contraste ≥ 4.5:1 (WCAG AA) si se ajustan colores a mano.
-->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" viewBox="0 0 400 400" width="400" height="400">
  <title>Episodio 02</title>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#301b12"/>
      <stop offset="100%" style="stop-color:#4a2a1c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e0a888"/>
      <stop offset="100%" style="stop-color:#eec0a4"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0%" style="stop-color:#eec0a4;stop-opacity:0.22"/>
      <stop offset="100%" style="stop-color:#eec0a4;stop-opacity:0"/>
    </radialGradient>
  </defs>

  <g inkscape:groupmode="layer" id="fondo" inkscape:label="fondo">
    <rect width="400" height="400" rx="8" fill="url(#bg)"/>
  </g>

  <g inkscape:groupmode="layer" id="marco" inkscape:label="marco">
    <rect x="20" y="20" width="360" height="360" rx="6" fill="none" stroke="url(#accent)" stroke-width="1.5" opacity="0.4"/>
    <rect x="60" y="100" width="280" height="2" fill="url(#accent)" opacity="0.6"/>
    <rect x="60" y="298" width="280" height="2" fill="url(#accent)" opacity="0.6"/>
  </g>

  <!-- Abanico de cartas (Uhart) + sombrilla y olas (Laiseca) -->
  <g inkscape:groupmode="layer" id="decoracion" inkscape:label="decoracion">
    <!-- sombrilla de balneario -->
    <circle cx="322" cy="196" r="34" fill="url(#glow)"/>
    <line x1="322" y1="172" x2="314" y2="264" stroke="url(#accent)" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="322" y1="172" x2="325" y2="160" stroke="url(#accent)" stroke-width="2" stroke-linecap="round"/>
    <path d="M 290 200 Q 300 176 322 172 Q 344 176 354 200 Q 344 206 332 202 Q 322 208 310 202 Q 300 206 290 200 Z" fill="url(#accent)" opacity="0.85"/>
    <line x1="322" y1="172" x2="300" y2="199" stroke="#4a2a1c" stroke-width="0.8" opacity="0.35"/>
    <line x1="322" y1="172" x2="344" y2="199" stroke="#4a2a1c" stroke-width="0.8" opacity="0.35"/>
    <!-- arena -->
    <path d="M 288 266 q 26 -8 54 0" fill="none" stroke="url(#accent)" stroke-width="1.5" opacity="0.4"/>

    <!-- abanico de cartas -->
    <rect x="178" y="192" width="44" height="66" rx="5" fill="url(#accent)" opacity="0.7" transform="rotate(-24 200 258)"/>
    <rect x="178" y="192" width="44" height="66" rx="5" fill="url(#accent)" opacity="0.7" transform="rotate(24 200 258)"/>
    <rect x="178" y="192" width="44" height="66" rx="5" fill="url(#accent)"/>
    <rect x="183" y="197" width="34" height="56" rx="3" fill="none" stroke="#4a2a1c" stroke-width="1" opacity="0.35"/>
    <text x="200" y="212" text-anchor="middle" fill="#4a2a1c" font-family="Georgia, serif" font-size="13" font-weight="bold">A</text>
    <text x="200" y="242" text-anchor="middle" fill="#4a2a1c" font-family="sans-serif" font-size="22">♠</text>

    <!-- olas -->
    <path d="M 70 292 q 10 -6 20 0 t 20 0 t 20 0 t 20 0 t 20 0 t 20 0" fill="none" stroke="url(#accent)" stroke-width="1.5" opacity="0.55"/>
    <path d="M 82 298 q 10 -5 20 0 t 20 0 t 20 0 t 20 0 t 20 0" fill="none" stroke="url(#accent)" stroke-width="1.2" opacity="0.3"/>

    <!-- brillos -->
    <text x="86" y="168" text-anchor="middle" fill="#eec0a4" font-family="sans-serif" font-size="11" opacity="0.3">✦</text>
  </g>

  <g inkscape:groupmode="layer" id="titulo" inkscape:label="titulo">
    <text x="200" y="150" text-anchor="middle" fill="url(#accent)" font-family="Georgia, serif" font-size="22" font-weight="bold">Episodio 02</text>
    <text x="200" y="180" text-anchor="middle" fill="#eec0a4" font-family="Georgia, serif" font-size="11" opacity="0.7">Hebe Uhart · Alberto Laiseca</text>
    <!--
      Si el título es largo, bajar font-size o partir en dos <text> (y=135 y y=160).
      El <title> del episodio tiene regla a11y: mantener textos legibles.
    -->
  </g>

  <g inkscape:groupmode="layer" id="badge" inkscape:label="badge">
    <rect x="140" y="260" width="120" height="24" rx="12" fill="url(#accent)" opacity="0.2"/>
    <text x="200" y="277" text-anchor="middle" fill="url(#accent)" font-family="sans-serif" font-size="11" font-weight="600">EPISODIO 2</text>
  </g>
</svg>
